# Builds the ReXGlue SDK (Xbox 360 static recompilation SDK, BSD-3-Clause) from source at a
# pinned commit, with its unit tests, on Windows and on Apple-silicon macOS.
# Purpose: prove the toolchain builds and record how long it takes. No game files are involved.
name: ReXGlue SDK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rexglue-sdk.yml"

permissions:
  contents: read

env:
  # rexglue/rexglue-sdk main, 2026-11-14. Change deliberately, and record why.
  REXGLUE_REF: ebac1cf0d04bab0042a5dd6148b34ab3953e9c0d
  # The presets use Ninja Multi-Config. Build and test one configuration, as a project would.
  BUILD_CONFIG: Debug

jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-amd64
            os: windows-latest
            cc: clang
            cxx: clang++
          - platform: mac-arm64
            os: macos-26
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out ReXGlue SDK at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: rexglue/rexglue-sdk
          ref: ${{ env.REXGLUE_REF }}
          submodules: recursive
          path: rexglue-sdk

      # ReXGlue requires AppleClang 17 or newer (Xcode 26+). Use the newest Xcode on the runner.
      - name: Select newest Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          ls -d /Applications/Xcode*.app || true
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          xcodebuild -version

      # ReXGlue's own toolchain action: LLVM 20 + CMake + Ninja + Vulkan SDK on Windows,
      # CMake + Ninja + Vulkan SDK on macOS.
      - name: Set up toolchain
        uses: ./rexglue-sdk/.github/actions/setup-toolchain
        with:
          platform: ${{ matrix.platform }}

      # ReXGlue's toolchain action installs the Vulkan Memory Allocator header (vk_mem_alloc.h)
      # on Windows but not on macOS, and configure stops without it (run 44043947564).
      # Homebrew has no formula for it (run 44048668591), so take the single header from the
      # official GPUOpen repository at a pinned release and verify its checksum.
      - name: Install Vulkan Memory Allocator header (macOS)
        if: runner.os == 'macOS'
        env:
          VMA_REF: v3.3.0   # commit 1d8f600fd424278486eade7ed3e877c99f0846b1
          VMA_SHA256: 90ce12fc4a2466235a09ae02905dd0c13aee80c1bbf11b331ab61230c2ceb112
        run: |
          inc="$RUNNER_TEMP/vma/include"
          mkdir -p "$inc"
          curl -fsSL -o "$inc/vk_mem_alloc.h" \
            "https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/${VMA_REF}/include/vk_mem_alloc.h"
          echo "${VMA_SHA256}  $inc/vk_mem_alloc.h" | shasum -a 256 -c -
          echo "EXTRA_CMAKE_ARGS=-DREXGLUE_VMA_INCLUDE_DIR=$inc" >> "$GITHUB_ENV"

      - name: Toolchain versions
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          { "${{ matrix.cxx }}" --version; cmake --version; ninja --version; echo "VULKAN_SDK=${VULKAN_SDK:-unset}"; } 2>&1 | tee "$RUNNER_TEMP/logs/versions.log"

      - name: Configure
        working-directory: rexglue-sdk
        run: |
          set -o pipefail
          cmake --preset ${{ matrix.platform }} \
            -DCMAKE_C_COMPILER="${{ matrix.cc }}" \
            -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}" \
            -DREXGLUE_BUILD_TESTS=ON ${EXTRA_CMAKE_ARGS:-} 2>&1 | tee "$RUNNER_TEMP/logs/configure.log"

      - name: Build and install
        id: build
        working-directory: rexglue-sdk
        run: |
          set -o pipefail
          start=$(date +%s)
          cmake --build out/build/${{ matrix.platform }} --config "$BUILD_CONFIG" --target install --parallel \
            2>&1 | tee "$RUNNER_TEMP/logs/build.log"
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # On the headless macOS runner, tests that open an SDL window trap inside AppKit
      # (NSWindow makeKeyAndOrderFront; lldb backtrace in run 44053778412). Use SDL's
      # offscreen video and dummy audio drivers so tests do not need a window server.
      - name: Run unit tests
        id: tests
        working-directory: rexglue-sdk
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_AUDIO_DRIVER: dummy
        run: |
          set -o pipefail
          ctest --test-dir out/build/${{ matrix.platform }} -C "$BUILD_CONFIG" --output-on-failure --no-tests=error \
            2>&1 | tee "$RUNNER_TEMP/logs/test.log"

      # Upstream builds macOS with tests off, so failures there have no upstream record.
      # Rerun the first few failed tests under lldb to capture a backtrace.
      - name: Backtraces of failed tests (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.tests.outcome == 'failure' }}
        working-directory: rexglue-sdk
        run: |
          dir="out/build/${{ matrix.platform }}"
          ctest --test-dir "$dir" -C "$BUILD_CONFIG" --show-only=json-v1 > "$RUNNER_TEMP/tests.json"
          failed=$(cat "$dir"/Testing/Temporary/LastTestsFailed*.log | cut -d: -f2- | head -3)
          echo "$failed" | while IFS= read -r name; do
            [ -n "$name" ] || continue
            echo "===== $name"
            python3 - "$RUNNER_TEMP/tests.json" "$name" > "$RUNNER_TEMP/cmd.txt" <<'PY'
          import json, sys
          for t in json.load(open(sys.argv[1]))["tests"]:
              if t["name"] == sys.argv[2]:
                  print("\0".join(t["command"]))
                  for p in t.get("properties", []):
                      if p["name"] == "WORKING_DIRECTORY":
                          print("WD=" + p["value"], file=sys.stderr)
          PY
            tr '\0' '\n' < "$RUNNER_TEMP/cmd.txt" | head -c 2000; echo
            cmd=()   # macOS /bin/bash is 3.2: no mapfile
            while IFS= read -r a; do cmd+=("$a"); done < <(tr '\0' '\n' < "$RUNNER_TEMP/cmd.txt")
            lldb --batch -o run -k "bt 40" -k quit -- "${cmd[@]}" 2>&1 | tail -n 80 || true
          done 2>&1 | tee "$RUNNER_TEMP/logs/backtrace.log"

      # The CLI is not installed; the build writes it to out/<platform>/<config>/ with a "d"
      # suffix in Debug (rex_config_postfix in src/rexglue/CMakeLists.txt).
      - name: Check the rexglue command-line tool
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: rexglue-sdk
        run: |
          set -o pipefail
          {
            exe=$(find out/${{ matrix.platform }} -maxdepth 2 -type f \( -name 'rexglue' -o -name 'rexglued' -o -name 'rexglue.exe' -o -name 'rexglued.exe' \) | head -1)
            echo "CLI: ${exe:-not found}"
            ls -l out/${{ matrix.platform }}
            test -n "$exe"
            "$exe" --help | head -40
          } 2>&1 | tee "$RUNNER_TEMP/logs/cli.log"

      # Job logs need a GitHub sign-in to read. Annotations do not, so publish the end of
      # every log as one annotation per file.
      - name: Publish log tails as annotations
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/logs/*.log; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .log)
            body=$(tail -n 60 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')
            level=notice
            if grep -qiE '(^|[^a-z])(error|failed|fatal)([^a-z]|$)' "$f"; then level=warning; fi
            echo "::${level} title=${{ matrix.platform }} ${name} (last 60 lines)::${body}"
          done

      - name: Summary
        if: always()
        working-directory: rexglue-sdk
        run: |
          {
            echo "### ReXGlue SDK — ${{ matrix.platform }} (${BUILD_CONFIG})"
            echo "- Commit: \`${REXGLUE_REF}\`"
            echo "- Build and install time: ${BUILD_SECONDS:-n/a} s"
            echo "- Build tree size: $(du -sh out/build 2>/dev/null | cut -f1)"
            echo "- Install size: $(du -sh out/install 2>/dev/null | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
